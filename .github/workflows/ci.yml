name: CI Pipeline - Build & Unit Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test on Ubuntu
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 3. Cài đặt thư viện dependencies
        run: npm install

      - name: 4. Build và kiểm tra cấu trúc dự án
        run: npm run build

      - name: 5. Chạy Unit Tests và đo Test Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: ci-test-secret-key-aura-fashion-group4

      - name: 6. Tải lên báo cáo Test Coverage (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14
