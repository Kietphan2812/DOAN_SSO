<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="auraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="25%" stop-color="#D4AC0D"/>
      <stop offset="50%" stop-color="#F7DC6F"/>
      <stop offset="75%" stop-color="#B7950B"/>
      <stop offset="100%" stop-color="#F1C40F"/>
    </linearGradient>
    <linearGradient id="auraDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D4AC0D" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury Background Badge -->
  <rect x="2" y="2" width="76" height="76" rx="20" fill="url(#auraDark)" stroke="url(#auraGold)" stroke-width="1.5" />

  <!-- Inner border ring -->
  <rect x="7" y="7" width="66" height="66" rx="16" fill="none" stroke="url(#auraGold)" stroke-width="0.75" stroke-opacity="0.5" stroke-dasharray="2 3"/>

  <!-- High-Fashion Interlocking Monogram "A" & Needle Motif -->
  <g filter="url(#auraGlow)">
    <!-- Left Leg of A -->
    <path d="M40 18 L24 58 L30 58 L40 33 L50 58 L56 58 Z" fill="url(#auraGold)" />
    
    <!-- Crossbar / Belt Ribbon -->
    <path d="M29 46 L51 46 L53 50 L27 50 Z" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- Diamond Star Accent at Apex -->
    <polygon points="40,14 42,19 47,21 42,23 40,28 38,23 33,21 38,19" fill="#FFF7D6" />

    <!-- Small Luxury Thread Ring -->
    <circle cx="40" cy="38" r="3" fill="none" stroke="url(#auraGold)" stroke-width="1.5"/>
  </g>
</svg>
